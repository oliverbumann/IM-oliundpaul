<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hinzufügen Medicus</title>
  <script src="medis_hinzufügen.js" defer></script>
  <link rel="stylesheet" href="styles/medis_hinzufügen.css">
</head>
<body>
  <div class="page-wrapper">

    <header>
      <h1>Neues Medikament hinzufügen</h1>
    </header>

    <main class="content">
      <form id="medForm">
        <label for="name">Medikamentenname:</label>
        <input type="text" id="name" class="input" required />

        <label for="frequency">Frequenz:</label>
        <select id="frequency" required>
          <option value="täglich">täglich</option>
          <option value="wöchentlich">wöchentlich</option>
          <option value="monatlich">monatlich</option>
        </select>

        <label for="start_date">Startdatum & Uhrzeit:</label>
        <input type="datetime-local" id="start_date" class="input" required />

        <label for="urgency">Einzunehmen innerhalb von:</label>
        <select id="urgency" required>
          <option value="egal">egal</option>
          <option value="1h">innerhalb 1h</option>
          <option value="2h">innerhalb 2h</option>
          <option value="3h">innerhalb 3h</option>
        </select>

        <button type="submit">Medikament speichern</button>
      </form>
    </main>

    <div class="button-container">
      <button class="nav-button" onclick="window.location.href='protected.html'">
        <img class="icon-button" src="/images/Icon house.svg" alt="Startseite">
        <p class="text-button">Startseite</p>
      </button>
      <button class="nav-button" onclick="window.location.href='medis_uebersicht.html'">
        <img class="icon-button" src="/images/icon-lupe.svg" alt="Lupe">
        <p class="text-button">Medikamente verwalten</p>
      </button>
    </div>

<footer id="sticky-footer">
  
  
</footer>


  </div>
</body>
</html>
